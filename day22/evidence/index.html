<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      color: #fff;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin-bottom: 24px;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,0.25);
      border: 4px solid #fff2;
    }
    h1 {
      font-size: 2.6rem;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    h2 {
      font-weight: 400;
      font-size: 1.25rem;
      margin-bottom: 32px;
      color: #bed6ee;
      letter-spacing: 1px;
    }
    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 24px;
      background: #fff1;
      color: #fff;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 18px 0 rgba(46,104,193,0.15);
      transition: background 0.2s, transform 0.2s;
      outline: none;
    }
    .btn:hover {
      background: #ffffff33;
      transform: translateY(-4px) scale(1.06);
    }
    .socials {
      margin-top: 36px;
    }
    .social-link {
      color: #fff;
      margin: 0 14px;
      font-size: 1.9rem;
      transition: color 0.15s;
      vertical-align: middle;
    }
    .social-link:hover {
      color: #ffe082;
    }
    @media (max-width: 600px) {
      .container {
        padding: 18px;
      }
      h1 {
        font-size: 2rem;
      }
      .buttons {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <img src="https://avatars.githubusercontent.com/u/9919?v=4" alt="avatar" class="avatar">
    <h1>Hi, I'm Your Name</h1>
    <h2>Full Stack Developer | Open Source Enthusiast</h2>
    <div class="buttons">
      <a href="#projects" class="btn">Projects</a>
      <a href="#contact" class="btn">Contact</a>
      <a href="https://github.com/" class="btn" target="_blank">GitHub</a>
    </div>
    <div class="socials">
      <a href="https://twitter.com/" target="_blank" class="social-link"><i class="fab fa-twitter"></i></a>
      <a href="https://linkedin.com/" target="_blank" class="social-link"><i class="fab fa-linkedin"></i></a>
      <a href="mailto:youremail@example.com" class="social-link"><i class="fas fa-envelope"></i></a>
    </div>
  </div>
</body>
</html>
